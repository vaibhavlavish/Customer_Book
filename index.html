<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B0E17">
<title>Suhag Jewellers — Your Installment Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oxblood:#3B0E17; --oxblood-deep:#2A0A10; --gold:#C6A15B; --gold-soft:#E7C9A9;
    --ivory:#FBF6EE; --ink:#2A2420; --ink-soft:#6b6058;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ivory); color:var(--ink);
    font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Cormorant Garamond', serif;}

  header{
    background:linear-gradient(180deg, var(--oxblood) 0%, var(--oxblood-deep) 100%);
    color:var(--ivory); padding:16px 20px 18px; position:relative; overflow:hidden;
  }
  header::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, rgba(198,161,91,.18), transparent 45%),
               radial-gradient(circle at 5% 110%, rgba(198,161,91,.12), transparent 40%);
    pointer-events:none;
  }
  .shop-row{display:flex; align-items:center; justify-content:center; gap:10px; position:relative;}
  .shop-name-row{display:flex; align-items:center; gap:12px;}
  .shop-logo{width:40px; height:40px; object-fit:contain; flex-shrink:0;}
  .shop-name{font-size:24px; font-weight:600; letter-spacing:.3px; margin:0; display:inline-block;}
  .shop-name em{color:var(--gold); font-style:normal;}
  .header-sub{
    font-size:11.5px; color:var(--gold-soft); font-weight:700; letter-spacing:.4px;
    text-transform:uppercase; margin:5px 0 0; text-align:center; position:relative;
  }

  main{max-width:520px; margin:0 auto; padding:24px 18px 60px;}

  .state-msg{text-align:center; color:var(--ink-soft); font-size:14px; padding:80px 20px;}

  .card{
    background:#fff; border:1px solid #EEE3CC; border-radius:16px; padding:20px;
    margin-bottom:16px; box-shadow:0 2px 10px rgba(59,14,23,.05);
  }
  .cust-name{font-size:19px; font-weight:700; margin:0 0 2px;}
  .cust-sub{font-size:12.5px; color:var(--ink-soft); margin:0;}

  .item-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid #F2EBDA; font-size:14px;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .price{font-weight:700; color:var(--ink);}

  .summary-row{display:flex; justify-content:space-between; padding:5px 0; font-size:14px;}
  .summary-row.total{font-size:17px; font-weight:800; border-top:1.5px solid #EEE3CC; margin-top:8px; padding-top:12px;}
  .summary-row .paid{color:#2E7D32; font-weight:700;}

  .paid-off-banner{
    background:linear-gradient(135deg, #E8F5E9, #F1F8F1); border:1.5px solid #A5D6A7;
    border-radius:14px; padding:18px; text-align:center; margin-bottom:16px;
  }
  .paid-off-banner .big{font-size:32px; margin-bottom:6px;}
  .paid-off-banner .title{font-size:16px; font-weight:800; color:#2E7D32; margin:0 0 4px;}
  .paid-off-banner .sub{font-size:12.5px; color:var(--ink-soft); margin:0;}

  .due-banner{
    background:linear-gradient(135deg, #FFF3E0, #FFF8ED); border:1.5px solid #FFCC80;
    border-radius:14px; padding:16px 18px; text-align:center; margin-bottom:16px;
  }
  .due-banner .amt{font-size:26px; font-weight:800; color:#E65100; margin:0 0 2px;}
  .due-banner .label{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; font-weight:700;}

  .cancelled-banner{
    background:#FFEBEE; border:1.5px solid #EF9A9A; border-radius:14px;
    padding:16px 18px; text-align:center; margin-bottom:16px; color:#C62828; font-weight:700; font-size:13.5px;
  }

  .section-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--ink-soft); margin:0 0 10px;
  }

  .payment-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid #F2EBDA; font-size:13.5px;
  }
  .payment-row:last-child{border-bottom:none;}
  .payment-row .date{color:var(--ink-soft);}
  .payment-row .amt{font-weight:700; color:#2E7D32;}
  .payment-note{font-size:11.5px; color:var(--ink-soft); display:block; margin-top:1px;}

  footer{text-align:center; padding:20px; font-size:11.5px; color:var(--ink-soft);}
  footer a{color:var(--oxblood); font-weight:600; text-decoration:none;}
</style>
</head>

    // the link IS the access — nothing about this page can browse to any
    // other customer's plan, because it never asks Firebase for anything
    // broader than this one specific path.
    const planRef = ref(db, 'installments/' + planId);
    onValue(planRef, snap => {
      const plan = snap.val();
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';

      if (!plan) {
        contentEl.innerHTML = '<p class="state-msg">We couldn\'t find a plan for this link. Please check the link the shop gave you, or contact us directly.</p>';
        return;
      }

      renderPlan(plan);
    }, err => {
      console.error(err);
      loadingEl.textContent = 'Could not load your plan right now — please try again in a moment.';
    });
  }

  function renderPlan(plan){
    const isCancelled = plan.status === 'cancelled';
    const isPaidOff = !isCancelled && (plan.remainingAmount || 0) <= 0;

    // Resolved (paid off or cancelled) — the plan is done, so there's
    // nothing left to show: no items, no amounts, no payment history.
    // Just a short confirmation and nothing else.
    if (isCancelled || isPaidOff) {
      const bannerHtml = isCancelled
        ? `<div class="cancelled-banner">This plan is no longer active. Please contact the shop if you have any questions.</div>`
        : `
          <div class="paid-off-banner">
            <div class="big">✅</div>
            <p class="title">Fully Paid</p>
            <p class="sub">Thank you! There's nothing left owing on this plan.</p>
          </div>
        `;
      contentEl.innerHTML = `
        <div class="card">
          <p class="cust-name">${escapeHtml(plan.customerName || 'Your Plan')}</p>
        </div>
        ${bannerHtml}
      `;
      return;
    }

    const itemsHtml = (plan.items || []).map(i => `
      <div class="item-row">
        <span>${escapeHtml(i.itemName || 'Item')}</span>
        <span class="price">₹${(i.finalPrice || 0).toFixed(2)}</span>
      </div>
    `).join('');

    const payments = (plan.payments || []).slice().reverse();
    const paymentsHtml = payments.length
      ? payments.map(p => `
          <div class="payment-row">
            <span class="date">${formatDate(p.date)}${p.note ? `<span class="payment-note">${escapeHtml(p.note)}</span>` : ''}</span>
            <span class="amt">₹${(p.amount || 0).toFixed(2)}</span>
          </div>
        `).join('')
      : '<p class="state-msg" style="padding:20px 0; font-size:13px;">No payments recorded yet.</p>';

    const bannerHtml = `
      <div class="due-banner">
        <p class="amt">₹${(plan.remainingAmount || 0).toFixed(2)}</p>
        <p class="label">Remaining Balance</p>
      </div>
    `;

    contentEl.innerHTML = `
      <div class="card">
        <p class="cust-name">${escapeHtml(plan.customerName || 'Your Plan')}</p>
        <p class="cust-sub">Started ${plan.createdAt ? formatDate(plan.createdAt) : ''}</p>
      </div>

      ${bannerHtml}

      <div class="card">
        <p class="section-label">Items</p>
        ${itemsHtml}
        <div class="summary-row total">
          <span>Total Amount</span><span>₹${(plan.totalAmount || 0).toFixed(2)}</span>
        </div>
        <div class="summary-row">
          <span>Paid So Far</span><span class="paid">₹${(plan.amountPaid || 0).toFixed(2)}</span>
        </div>
      </div>

      <div class="card">
        <p class="section-label">Payment History</p>
        ${paymentsHtml}
      </div>
    `;
  }
</script>

</body>
</html>
